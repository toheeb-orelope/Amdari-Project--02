[extend]
useDefault = true

# ── YAML ──────────────────────────────────────────────────────────────────────
[[rules]]
id = "yaml-aws-access-key"
description = "AWS Access Key in YAML"
regex = '''(?i)aws.?access.?key.?id\s*:\s*['"]?([A-Z0-9]{20})['"]?'''
tags = ["aws", "key"]

[[rules]]
id = "yaml-aws-secret-key"
description = "AWS Secret Key in YAML"
regex = '''(?i)aws.?secret.?access.?key\s*:\s*['"]?([a-zA-Z0-9/+=]{40})['"]?'''
tags = ["aws", "secret"]

[[rules]]
id = "yaml-jwt-secret"
description = "JWT Secret in YAML"
regex = '''(?i)jwt.?secret\s*:\s*['"]?([a-zA-Z0-9\-_]{16,})['"]?'''
tags = ["jwt", "secret"]

[[rules]]
id = "yaml-generic-secret"
description = "Generic secret in YAML"
regex = '''(?i)(password|secret|token|api.?key)\s*:\s*['"]?([a-zA-Z0-9\-_\/+=]{8,})['"]?'''
entropy = 3.0
tags = ["generic", "secret"]

# ── Python ────────────────────────────────────────────────────────────────────
[[rules]]
id = "python-hardcoded-secret"
description = "Hardcoded secret in Python assignment"
regex = '''(?i)(password|secret|token|api.?key|access.?key)\s*=\s*['"]([a-zA-Z0-9\-_\/+=]{8,})['"]'''
secretGroup = 2
entropy = 3.5
tags = ["python", "secret"]
[[rules.allowlists]]
paths = ['''.*\.sh$''']

[[rules]]
id = "python-aws-key"
description = "AWS key in Python"
regex = '''(?i)aws.?access.?key.?id\s*=\s*['"]([A-Z0-9]{20})['"]'''
tags = ["python", "aws"]

[[rules]]
id = "python-aws-secret"
description = "AWS secret in Python"
regex = '''(?i)aws.?secret.?access.?key\s*=\s*['"]([a-zA-Z0-9/+=]{40})['"]'''
tags = ["python", "aws"]

# ── Terraform ─────────────────────────────────────────────────────────────────
[[rules]]
id = "terraform-hardcoded-secret"
description = "Hardcoded secret in Terraform"
regex = '''(?i)(password|secret|token|access_key|secret_key)\s*=\s*['"]([a-zA-Z0-9\-_\/+=]{8,})['"]'''
secretGroup = 2
entropy = 3.0
tags = ["terraform", "secret"]

[[rules]]
id = "terraform-aws-access-key"
description = "AWS Access Key in Terraform"
regex = '''(?i)access_key\s*=\s*['"]([A-Z0-9]{20})['"]'''
tags = ["terraform", "aws"]

[[rules]]
id = "terraform-aws-secret-key"
description = "AWS Secret Key in Terraform"
regex = '''(?i)secret_key\s*=\s*['"]([a-zA-Z0-9/+=]{40})['"]'''
tags = ["terraform", "aws"]

# ── GitHub Actions ────────────────────────────────────────────────────────────
[[rules]]
id = "gha-hardcoded-secret"
description = "Hardcoded secret in GitHub Actions"
regex = '''(?i)(password|token|api.?key|secret)\s*:\s*['"]?([a-zA-Z0-9\-_\/+=]{8,})['"]?'''
secretGroup = 2
entropy = 3.5
tags = ["github-actions", "secret"]
path = '''\.github/workflows/.*\.ya?ml$'''
[[rules.allowlists]]
regexes = ['''\$\{\{\s*secrets\.''']

# ── Environment files ─────────────────────────────────────────────────────────
[[rules]]
id = "dotenv-secret"
description = "Secret in .env or .env.example file"
regex = '''(?i)(PASSWORD|SECRET|TOKEN|API_KEY|ACCESS_KEY)\s*=\s*['"]?([a-zA-Z0-9\-_\/+=]{8,})['"]?'''
secretGroup = 2
entropy = 3.5
tags = ["dotenv", "secret"]
[[rules.allowlists]]
regexes = [
  '''(?i)^[a-z_]+\(''',
  '''(?i)^(true|false|null|none|undefined)$''',
  '''(?i)^export\s+''',   # exclude export statements - shell rule handles these
]

# ── Shell scripts ─────────────────────────────────────────────────────────────
[[rules]]
id = "shell-export-secret"
description = "Exported secret in shell script"
regex = '''(?i)export\s+(PASSWORD|SECRET|TOKEN|API_KEY|ACCESS_KEY|WEBHOOK)\s*=\s*['"]?([a-zA-Z0-9\-_\/+=:/.]{8,})['"]?'''
secretGroup = 2
entropy = 3.0
tags = ["shell", "secret"]