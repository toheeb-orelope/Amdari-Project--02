name: SentinelPay Security Gate and Deploy

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write
  security-events: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PAYMENTS_IMAGE_NAME: payments-api
  KYC_IMAGE_NAME: kyc-api

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.ref_name == 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" --workdir /repo ghcr.io/gitleaks/gitleaks:latest detect --source . --config .gitleaks.toml --report-format json --report-path gitleaks-report.json --verbose
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  app-security:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.ref_name == 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/payments-api/requirements.txt
          pip install -r services/kyc-api/requirements.txt
          pip install pytest bandit semgrep
      - name: Run tests
        run: |
          python -m pytest services/payments-api/tests
          python -m pytest services/kyc-api/tests
      - name: Bandit
        run: bandit -r services -ll
      - name: Semgrep
        run: semgrep scan --config auto services
      - name: SonarQube
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  iac-security:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.ref_name == 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra
      - name: Terraform validate all envs
        run: |
          for env in dev staging prod; do
            terraform -chdir=infra/envs/$env init -backend=false
            terraform -chdir=infra/envs/$env validate
          done
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          output_format: cli,sarif,json
          output_file_path: console,checkov-terraform.sarif,checkov-terraform.json
          soft_fail: ${{ github.ref_name == 'dev' }}
      - name: tfsec
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          sarif_file: tfsec.sarif
      - if: always() && hashFiles('checkov-terraform.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-terraform.sarif
      - if: always() && hashFiles('tfsec.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec.sarif
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-reports
          path: |
            checkov-terraform.json
            checkov-terraform.sarif
            tfsec.sarif

  image-security:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.ref_name == 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build --pull -t payments-api:${{ github.sha }} services/payments-api
          docker build --pull -t kyc-api:${{ github.sha }} services/kyc-api
      - name: Scan payments-api
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: payments-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          vuln-type: os,library
          format: json
          output: trivy-payments-api.json
          exit-code: ${{ github.ref_name == 'dev' && '0' || '1' }}
      - name: Scan kyc-api
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kyc-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          vuln-type: os,library
          format: json
          output: trivy-kyc-api.json
          exit-code: ${{ github.ref_name == 'dev' && '0' || '1' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: trivy-*.json

  publish-sign:
    runs-on: ubuntu-latest
    needs: [secret-scan, app-security, iac-security, image-security]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      payments_image: ${{ steps.images.outputs.payments_image }}
      kyc_image: ${{ steps.images.outputs.kyc_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3.7.0
      - uses: anchore/sbom-action/download-syft@v0.17.9
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push images
        id: images
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          payments_image="ghcr.io/${owner}/${repo}/payments-api:${GITHUB_SHA}"
          kyc_image="ghcr.io/${owner}/${repo}/kyc-api:${GITHUB_SHA}"
          docker build --pull -t "$payments_image" services/payments-api
          docker build --pull -t "$kyc_image" services/kyc-api
          docker push "$payments_image"
          docker push "$kyc_image"
          echo "payments_image=$payments_image" >> "$GITHUB_OUTPUT"
          echo "kyc_image=$kyc_image" >> "$GITHUB_OUTPUT"
      - name: Generate SBOMs
        run: |
          syft "${{ steps.images.outputs.payments_image }}" -o spdx-json=payments-api-sbom.spdx.json
          syft "${{ steps.images.outputs.kyc_image }}" -o spdx-json=kyc-api-sbom.spdx.json
      - name: Keyless sign images and attest SBOMs
        env:
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          cosign sign --yes "${{ steps.images.outputs.payments_image }}"
          cosign sign --yes "${{ steps.images.outputs.kyc_image }}"
          cosign attest --yes --predicate payments-api-sbom.spdx.json --type spdxjson "${{ steps.images.outputs.payments_image }}"
          cosign attest --yes --predicate kyc-api-sbom.spdx.json --type spdxjson "${{ steps.images.outputs.kyc_image }}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-sboms
          path: '*-sbom.spdx.json'

  deploy-dev:
    runs-on: ubuntu-latest
    needs: publish-sign
    if: github.event_name == 'push' && github.ref_name == 'dev'
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Terraform apply dev
        working-directory: infra/envs/dev
        env:
          TF_VAR_redis_auth_token: ${{ secrets.DEV_REDIS_AUTH_TOKEN }}
          TF_VAR_certificate_arn: ${{ vars.DEV_CERTIFICATE_ARN }}
          TF_VAR_terraform_state_bucket_arn: ${{ vars.DEV_TERRAFORM_STATE_BUCKET_ARN }}
          TF_VAR_terraform_lock_table_arn: ${{ vars.DEV_TERRAFORM_LOCK_TABLE_ARN }}
          TF_VAR_terraform_state_kms_key_arn: ${{ vars.DEV_TERRAFORM_STATE_KMS_KEY_ARN }}
          TF_VAR_payments_image: ${{ needs.publish-sign.outputs.payments_image }}
          TF_VAR_kyc_image: ${{ needs.publish-sign.outputs.kyc_image }}
        run: |
          terraform init
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

  deploy-staging:
    runs-on: ubuntu-latest
    needs: publish-sign
    if: github.event_name == 'push' && github.ref_name == 'staging'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Terraform apply staging
        working-directory: infra/envs/staging
        env:
          TF_VAR_redis_auth_token: ${{ secrets.STAGING_REDIS_AUTH_TOKEN }}
          TF_VAR_certificate_arn: ${{ vars.STAGING_CERTIFICATE_ARN }}
          TF_VAR_payments_image: ${{ needs.publish-sign.outputs.payments_image }}
          TF_VAR_kyc_image: ${{ needs.publish-sign.outputs.kyc_image }}
        run: |
          terraform init
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

  zap-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref_name == 'staging'
    environment:
      name: staging
    steps:
      - name: OWASP ZAP baseline
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          test -n "$STAGING_URL"
          mkdir -p zap-output
          docker run --rm -v "${{ github.workspace }}/zap-output:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$STAGING_URL" -J zap-report.json -w zap-report.md -r zap-report.html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-output/

  deploy-prod:
    runs-on: ubuntu-latest
    needs: publish-sign
    if: github.event_name == 'push' && github.ref_name == 'main'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PROD_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - name: Terraform apply production
        working-directory: infra/envs/prod
        env:
          TF_VAR_redis_auth_token: ${{ secrets.PROD_REDIS_AUTH_TOKEN }}
          TF_VAR_certificate_arn: ${{ vars.PROD_CERTIFICATE_ARN }}
          TF_VAR_payments_image: ${{ needs.publish-sign.outputs.payments_image }}
          TF_VAR_kyc_image: ${{ needs.publish-sign.outputs.kyc_image }}
        run: |
          terraform init
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan


